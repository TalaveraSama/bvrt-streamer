name: audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis bash
        run: |
          bash -n installer/ms_install_offline.sh
          bash -n tools/scan_payload.sh
          bash -n tests/test_scan.sh
          bash -n upstream/ms_install_offline.sh

      - name: Instalar shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: ShellCheck (solo errores reales)
        run: |
          shellcheck -S error tools/scan_payload.sh tests/test_scan.sh || true
          shellcheck -S error -e SC2086,SC2181 installer/ms_install_offline.sh || true

      - name: Pruebas del escáner
        run: ./tests/test_scan.sh

      - name: Los hashes publicados deben coincidir con los archivos
        run: |
          ( cd installer && sha256sum -c ms_install_offline.sh.sha256 )
          test "$(sha256sum install.sh | awk '{print $1}')" = "$(awk '{print $1}' install.sh.sha256)"

      - name: El upstream debe coincidir con el hash auditado
        run: |
          echo "57af018eb6cf4b189eae124ed4fa7953c82da26801775f100eb8f624f2965885  upstream/ms_install_offline.sh" | sha256sum -c -
